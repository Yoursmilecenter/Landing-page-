<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Login to Smile Center Portal - Access your dental design workspace for administrators, designers, and clients.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Performance: Preconnect to critical origins -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="preload" href="fonts/heebo-hebrew-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/heebo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

    <title>Login - Smile Center Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @font-face { font-family: 'Heebo'; src: url('fonts/heebo-hebrew-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
        @font-face { font-family: 'Heebo'; src: url('fonts/heebo-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

        body.login-page {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            box-sizing: border-box;
            background: #f7f7f8;
            color: #0f172a;
            font-family: Heebo, Arial, sans-serif;
        }

        /* Card */
        .login-page .login-container {
            display: block;
            min-height: 0;
            width: min(100%, 420px);
            box-sizing: border-box;
            padding: 40px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
        }
        .login-page .brand-mark {
            display: block;
            direction: ltr;
            width: 32px;
            height: 32px;
            margin: 0 auto 12px;
            transform: translateY(4px);
        }
        .login-page .brand-mark svg { display: block; width: 32px; height: 32px; }
        .login-page .login-heading {
            margin: 0 0 24px;
            text-align: center;
            font: 600 26px/1.25 Heebo, Arial, sans-serif;
            color: #0f172a;
        }
        .login-page .login-container form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0;
            background: none;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .login-page .form-group { margin: 0; }
        .login-page .form-label {
            display: block;
            margin: 0 0 8px;
            font: 600 13px/1.3 Heebo, Arial, sans-serif;
            color: #0f172a;
        }
        .login-page .form-input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            height: 46px;
            padding: 0 14px;
            font: 400 14px Heebo, Arial, sans-serif;
            color: #0f172a;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: none;
        }
        .login-page .form-input::placeholder { color: #64748b; }
        .login-page .form-input[readonly] { background: #f8fafc; color: #64748b; }
        .login-page .form-input:focus {
            outline: 3px solid rgba(251, 148, 120, 0.28);
            border-color: #b95039;
        }
        .login-page .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 48px;
            margin-top: 8px;
            padding: 0;
            font: 600 14px Heebo, Arial, sans-serif;
            color: #0f172a;
            background: #fb9478;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: none;
            transition: background 0.15s;
        }
        .login-page .btn-primary:hover { background: #f38163; }
        .login-page .btn-primary:focus-visible { outline: 3px solid #b95039; outline-offset: 2px; }
        .login-page .btn-primary:disabled { opacity: .6; cursor: default; }

        /* Invite loader */
        .invite-loader {
            position: fixed; inset: 0; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
            background: linear-gradient(160deg, #ffffff 0%, #fff3ed 100%);
            transition: opacity .25s ease;
        }
        .invite-loader[hidden] { display: none; }
        .invite-loader.fade-out { opacity: 0; pointer-events: none; }
        .invite-loader .loader-mark {
            width: 64px; height: 64px; border-radius: 16px; background: #ffffff;
            box-shadow: 0 12px 36px rgba(15,23,42,0.10);
            display: flex; align-items: center; justify-content: center;
            animation: loaderPulse 1.4s ease-in-out infinite;
        }
        .invite-loader .loader-mark svg { width: 34px; height: 34px; }
        @keyframes loaderPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .85; } }
        .invite-loader .loader-word { font: 600 15px/1.3 Heebo, Arial, sans-serif; color: #64748b; }
        @media (prefers-reduced-motion: reduce) {
            .invite-loader .loader-mark { animation: none; }
            .invite-loader { transition: none; }
        }

        /* Card header: logo + language pill (invite mode only) */
        .card-header { display: none; }
        body.invite-mode .card-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 24px 0;
        }
        body.invite-mode .card-header .brand-mark-mini { display: flex; align-items: center; gap: 10px; direction: ltr; width: auto; height: auto; }
        body.invite-mode .card-header .brand-mark-mini svg { display: block; width: 28px; height: 28px; flex: none; }
        body.invite-mode .card-header .brand-wordmark { font: 600 15px/1 Heebo, Arial, sans-serif; color: #18202e; white-space: nowrap; }
        body.invite-mode #mainBrandMark { display: none; }

        /* Invite hero + form: one continuous card on mobile, two columns on desktop */
        .page-shell { width: min(100%, 420px); }
        .invite-hero { display: none; }
        body.invite-mode .page-shell {
            width: min(100%, 960px);
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
            overflow: hidden;
        }
        body.invite-mode .invite-hero {
            display: flex; flex-direction: column; justify-content: center; gap: 12px;
            padding: 20px 24px 4px;
        }
        body.invite-mode .invite-hero .hero-headline { margin: 0; font: 600 22px/1.3 Heebo, Arial, sans-serif; color: #18202e; }
        body.invite-mode .invite-hero .hero-promise { margin: 0; font: 400 14px/1.5 Heebo, Arial, sans-serif; color: #64748b; }
        body.invite-mode .login-container {
            border: 0; border-radius: 0; box-shadow: none; background: transparent;
            padding: 12px 24px 32px;
        }
        @media (min-width: 860px) {
            body.invite-mode .page-shell {
                width: min(100%, 960px);
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-areas: "header header" "hero form";
                align-items: stretch;
            }
            body.invite-mode .card-header { grid-area: header; padding: 16px 40px 0; }
            body.invite-mode .card-header .brand-mark-mini svg { width: 32px; height: 32px; }
            body.invite-mode .card-header .brand-wordmark { font-size: 17px; }
            body.invite-mode .invite-hero {
                grid-area: hero; padding: 16px 40px 40px;
                background: linear-gradient(160deg, #fff3ed 0%, #ffe4d8 100%);
                border-inline-end: 1px solid #e2e8f0;
                display: flex; flex-direction: column; justify-content: flex-start;
            }
            body.invite-mode .invite-hero .hero-headline { font-size: 28px; }
            body.invite-mode .invite-hero .hero-promise { font-size: 15px; }
            body.invite-mode .login-container {
                grid-area: form; padding: 16px 40px 40px;
                display: flex; flex-direction: column; justify-content: center;
                align-items: flex-start; text-align: start;
            }
            body.invite-mode .login-container .login-heading,
            body.invite-mode .login-container .form-intro { text-align: start; }
        }
        .existing-account { margin: 18px 0 0; text-align: center; font: 400 13px/1.4 Heebo, Arial, sans-serif; color: #64748b; }
        .existing-account a { color: #b95039; font-weight: 600; text-decoration: none; }
        .existing-account a:hover { text-decoration: underline; }
        .invite-invalid { display: none; text-align: center; padding: 8px 0; }
        .invite-invalid.active { display: block; }
        .invite-invalid p { margin: 0 0 16px; font: 400 14px/1.5 Heebo, Arial, sans-serif; color: #64748b; }

        /* Status messages */
        .login-page .status-msg { display: none; margin: 0; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; text-align: start; }
        .login-page .status-msg.active { display: block; }
        .login-page .status-msg.error { background: #fef2f2; color: #b91c1c; }
        .login-page .status-msg.success { background: #f0fdf4; color: #166534; }
        .login-page .status-msg.warning { background: #fff3ed; color: #b95039; }

        /* Language switch: floating dropdown (login page) */
        .lang-toggle { position: absolute; top: 20px; right: 20px !important; z-index: 100; }
        body.invite-mode .lang-toggle { display: none; }
        .lang-dropdown {
            padding: 6px 12px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #0f172a;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lang-dropdown img, .lang-option img { width: 20px; height: 15px; object-fit: cover; border-radius: 2px; }
        .lang-dropdown:hover { background: #fff3ed; }
        .lang-dropdown:focus-visible { outline: 3px solid #b95039; outline-offset: 2px; }
        .lang-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 4px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            z-index: 1000;
            min-width: 120px;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.10);
        }
        .lang-menu.active { display: block; }
        .lang-option {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #0f172a;
            white-space: nowrap;
        }
        .lang-option:hover { background: #fff3ed; }

        /* Language pill (invite/registration header) */
        .lang-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 10px; border: 1px solid #e2e8f0; border-radius: 999px;
            font: 600 12px/1 Heebo, Arial, sans-serif; color: #64748b;
        }
        .lang-pill button {
            background: none; border: 0; padding: 2px; cursor: pointer;
            font: 600 12px Heebo, Arial, sans-serif; color: #64748b;
        }
        .lang-pill button.active { color: #b95039; }
        .lang-pill button:focus-visible { outline: 2px solid #b95039; outline-offset: 2px; border-radius: 4px; }
        .lang-pill .sep { color: #d9dee5; }

        .login-page .form-label { text-align: start; }
        .login-page #password, .login-page #invitePassword, .login-page #invitePasswordConfirm, .login-page #invitePhone { direction: ltr; }

        @media (max-width: 600px) {
            .login-page .login-container { padding: 24px; }
        }
    </style>
</head>

            <a class="btn-primary" style="display:inline-flex;text-decoration:none;padding:0 24px;" href="https://wa.me/972559339666?text=Hi%2C%20my%20invite%20link%20isn%27t%20working" data-en="Request a new link" data-he="בקשו קישור חדש"></a>

    <script>
        window.switchLang = function(lang) {
            const html = document.documentElement;
            
            // Update HTML attributes
            html.setAttribute('lang', lang);
            html.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
            
            // Update dropdown
            const dropdown = document.getElementById('langDropdown');
            if (dropdown) {
                dropdown.innerHTML = `<img src="https://flagcdn.com/w20/${lang === 'he' ? 'il' : 'gb'}.png" alt="Flag"><span>▼</span>`;
            }
            
            // Close menu
            const menu = document.getElementById('langMenu');
            if (menu) menu.classList.remove('active');

            // Update lang pill active state
            const pillEn = document.getElementById('langPillEn');
            const pillHe = document.getElementById('langPillHe');
            if (pillEn && pillHe) {
                pillEn.classList.toggle('active', lang === 'en');
                pillHe.classList.toggle('active', lang === 'he');
            }
            
            // Update all text elements
            document.querySelectorAll('[data-en]').forEach(el => {
                const text = el.getAttribute('data-' + lang);
                if (el.tagName === 'INPUT') {
                    el.placeholder = text;
                } else {
                    el.textContent = text;
                }
            });
            
            // Save preference
            localStorage.setItem('lang', lang);
        };

        // Load saved language
        const savedLang = localStorage.getItem('lang') || 'he';
        switchLang(savedLang);
    </script>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc, addDoc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBOmZxS75qIodscsge-gHYuUlb2vCvl0ZM",
            authDomain: "smile-center-7c6f5.firebaseapp.com",
            projectId: "smile-center-7c6f5",
            storageBucket: "smile-center-7c6f5.firebasestorage.app",
            messagingSenderId: "517098616907",
            appId: "1:517098616907:web:6e321d280049cd67c1b5ce"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Check if this is an invite link
        const urlParams = new URLSearchParams(window.location.search);
        const inviteCode = urlParams.get('invite');
        const invitePhone = urlParams.get('phone');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const applyLangToEl = el => {
            const lang = document.documentElement.lang === 'he' ? 'he' : 'en';
            const text = el.getAttribute('data-' + lang);
            if (text == null) return;
            if (el.tagName === 'INPUT') el.placeholder = text; else el.textContent = text;
        };

        if (inviteCode && invitePhone) {
            const loader = document.getElementById('inviteLoader');
            loader.hidden = false;
            const revealStart = Date.now();
            const MIN_LOADER_MS = reduceMotion ? 0 : 550;
            const MAX_WAIT_MS = 3000;

            const finishLoader = () => {
                const elapsed = Date.now() - revealStart;
                const wait = Math.max(0, MIN_LOADER_MS - elapsed);
                setTimeout(() => {
                    if (reduceMotion) { loader.hidden = true; }
                    else {
                        loader.classList.add('fade-out');
                        setTimeout(() => { loader.hidden = true; }, 260);
                    }
                }, wait);
            };

            const showInvalid = () => {
                document.body.classList.add('invite-mode');
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('inviteForm').style.display = 'none';
                document.getElementById('inviteHero').hidden = true;
                document.getElementById('formIntro').hidden = true;
                document.getElementById('existingAccountLine').hidden = true;
                document.getElementById('inviteInvalid').classList.add('active');
                const h = document.getElementById('formHeading');
                h.setAttribute('data-en', "Link unavailable"); h.setAttribute('data-he', 'הקישור אינו זמין');
                applyLangToEl(h);
                applyLangToEl(document.getElementById('inviteInvalidMsg'));
                document.querySelectorAll('#inviteInvalid a').forEach(applyLangToEl);
                finishLoader();
            };

            const showInviteForm = () => {
                document.body.classList.add('invite-mode');
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('inviteForm').style.display = 'flex';
                document.getElementById('inviteHero').hidden = false;
                document.getElementById('formIntro').hidden = false;
                document.getElementById('existingAccountLine').hidden = false;
                document.getElementById('invitePhone').value = invitePhone;
                const h = document.getElementById('formHeading');
                h.setAttribute('data-en', 'Create your account');
                h.setAttribute('data-he', 'יצירת חשבון');
                [h, document.getElementById('formIntro'), document.getElementById('heroHeadline'),
                 document.getElementById('heroPromise'), document.getElementById('invitePhone'),
                 ...document.querySelectorAll('#existingAccountLine [data-en]')].forEach(applyLangToEl);
                finishLoader();
            };

            let settled = false;
            const settle = fn => { if (settled) return; settled = true; fn(); };
            const timeoutGuard = setTimeout(() => settle(showInvalid), MAX_WAIT_MS);

            getDoc(doc(db, 'invites', inviteCode)).then(snap => {
                clearTimeout(timeoutGuard);
                if (!snap.exists() || snap.data().phone !== invitePhone || snap.data().used) {
                    settle(showInvalid);
                } else {
                    settle(showInviteForm);
                }
            }).catch(() => { clearTimeout(timeoutGuard); settle(showInvalid); });
        }

        window.handleLogin = async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const statusEl = document.getElementById('loginStatus');

            let loginEmail = email;

            // If only numbers (phone), convert to phone@smilecenter.pro
            if (/^\d+$/.test(email)) {
                loginEmail = email + '@smilecenter.pro';
            }
            // If no @ symbol, treat as username and convert to email format
            else if (!email.includes('@')) {
                loginEmail = email + '@smilecenter.pro';
            }

            try {
                let userCredential;
                try {
                    userCredential = await signInWithEmailAndPassword(auth, loginEmail, password);
                } catch (e) {
                    // Fallback: try old @smile.local domain for existing users
                    if (!email.includes('@')) {
                        const legacyEmail = email + '@smile.local';
                        userCredential = await signInWithEmailAndPassword(auth, legacyEmail, password);
                    } else {
                        throw e;
                    }
                }

                // Get user role from Firestore
                const userDoc = await getDoc(doc(db, 'users', userCredential.user.uid));

                if (!userDoc.exists()) {
                    statusEl.textContent = 'User profile not found. Contact administrator.';
                    statusEl.className = 'status-msg active error';
                    await auth.signOut();
                    return;
                }

                const userData = userDoc.data();
                const role = userData.role;

                // Redirect based on role from Firestore
                if (role === 'admin') {
                    window.location.href = 'admin-panel.html';
                } else if (role === 'designer') {
                    window.location.href = 'designer-portal.html';
                } else if (role === 'client') {
                    window.location.href = 'portal-dashboard.html';
                } else {
                    statusEl.textContent = 'Invalid user role. Contact administrator.';
                    statusEl.className = 'status-msg active error';
                    await auth.signOut();
                }
            } catch (error) {
                console.error('Login error:', error);
                statusEl.textContent = 'Invalid credentials';
                statusEl.className = 'status-msg active error';
            }
        };

        window.handleInviteRegistration = async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('invitePhone').value;
            const password = document.getElementById('invitePassword').value;
            const passwordConfirm = document.getElementById('invitePasswordConfirm').value;
            const statusEl = document.getElementById('inviteStatus');
            const submitBtn = document.getElementById('inviteSubmitBtn');

            if (password !== passwordConfirm) {
                statusEl.textContent = '✗ Passwords do not match';
                statusEl.className = 'status-msg active error';
                return;
            }

            submitBtn.disabled = true;
            try {
                statusEl.textContent = 'Verifying invite...';
                statusEl.className = 'status-msg active warning';

                // Verify invite code
                const inviteSnap = await getDoc(doc(db, 'invites', inviteCode));

                if (!inviteSnap.exists() || inviteSnap.data().phone !== phone) {
                    statusEl.textContent = '✗ Invalid or expired invite link';
                    statusEl.className = 'status-msg active error';
                    return;
                }

                const inviteDoc = inviteSnap;
                const inviteData = inviteSnap.data();

                if (inviteData.used) {
                    statusEl.textContent = '✗ This invite has already been used';
                    statusEl.className = 'status-msg active error';
                    return;
                }

                // Create account with phone as email (using @smilecenter.pro for consistency)
                const email = phone + '@smilecenter.pro';
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);

                // Create user document in Firestore (using UID as document ID)
                await setDoc(doc(db, 'users', userCredential.user.uid), {
                    uid: userCredential.user.uid,
                    username: phone,
                    phone: phone,
                    email: null,
                    role: 'client',
                    loginType: 'phone',
                    createdAt: Date.now(),
                    inviteCode: inviteCode
                });

                // Mark invite as used
                await updateDoc(doc(db, 'invites', inviteDoc.id), {
                    used: true,
                    usedAt: Date.now()
                });

                statusEl.textContent = 'Registration complete! Redirecting...';
                statusEl.className = 'status-msg active success';

                setTimeout(() => {
                    window.location.href = 'portal-dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('Registration error:', error);
                let errorMsg = 'Registration failed';
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = 'Phone number already registered';
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = 'Password too weak (min 6 characters)';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMsg = 'Network error. Please check connection';
                } else if (error.message) {
                    errorMsg = error.message;
                }
                statusEl.textContent = errorMsg;
                statusEl.className = 'status-msg active error';
            } finally {
                if (!statusEl.textContent.includes('Redirecting')) submitBtn.disabled = false;
            }
        };
    </script>
