            currentLang = lang;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                if (!admins.some(a => a.email === currentUser.email)) {
                    window.location.href = 'index.html';
                    return;
                }
                await loadData();
                initSessionTimeout();
            } else {
                window.location.href = 'portal-login.html';
            }
        });

        // Session Timeout Management
        let sessionTimeout;
        const TIMEOUT_DURATION = 15 * 60 * 1000; // 15 minutes in milliseconds

        function initSessionTimeout() {
            resetSessionTimeout();
            
            // Reset timeout on user activity
            const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click'];
            events.forEach(event => {
                document.addEventListener(event, resetSessionTimeout, true);
            });
        }

        function resetSessionTimeout() {
            clearTimeout(sessionTimeout);
            sessionTimeout = setTimeout(async () => {
                alert('Your session has expired due to inactivity. You will be logged out.');
                await signOut(auth);
                window.location.href = 'portal-login.html';
            }, TIMEOUT_DURATION);
        }

        async function loadData(force = false) {
            const now = Date.now();
            if (!force && now - lastLoadTime < CACHE_DURATION && allProjects.length > 0) {
                applyFilters();
                return;
            }

            try {
                const projectsRef = collection(db, 'projects');
                const q = query(projectsRef, orderBy('createdAt', 'desc'));
                const snapshot = await getDocs(q);
                
                allProjects = [];
                const filePromises = [];
                
                snapshot.docs.forEach(docSnap => {
                    const data = docSnap.data();
                    allProjects.push({
                        id: docSnap.id,
                        ...data,
                        files: []
                    });
                    filePromises.push(loadFilesForProject(docSnap.id));
                });
                
                const filesResults = await Promise.all(filePromises);
                filesResults.forEach((files, index) => {
                    allProjects[index].files = files;
                });
                
                await loadClientsData();
                lastLoadTime = now;
                applyFilters();
            } catch (error) {
                console.error('Error:', error);
                if (error.code === 'permission-denied') {
                    alert('Access denied. Please contact administrator.');
                }
                render();
            }
        }

        async function loadFilesForProject(projectId) {
            if (projectsCache.has(projectId)) {
                return projectsCache.get(projectId);
            }
            
            const files = await loadFiles(projectId);
            projectsCache.set(projectId, files);
            return files;
        }

        async function loadFiles(projectId) {
            try {
                const filesRef = ref(storage, `projects/${projectId}`);
                const list = await listAll(filesRef);
                
                const filePromises = list.items.map(async (item) => {
                    const [url, meta] = await Promise.all([
                        getDownloadURL(item),
                        getMetadata(item)
                    ]);
                    return {
                        name: item.name,
                        url,
                        path: item.fullPath,
                        size: meta.size,
                        date: new Date(meta.timeCreated).toLocaleDateString()
                    };
                });
                
                return await Promise.all(filePromises);
            } catch {
                return [];
            }
        }

        function applyFilters() {
            if (searchTimeout) {
                clearTimeout(searchTimeout);
            }
            
            searchTimeout = setTimeout(() => {
                filteredProjects = allProjects.filter(p => {
                    if (adminPatientKey && dxKeyOf(p) !== adminPatientKey) return false;
                    const sq = adminSearch.trim().toLowerCase();
                    if (sq && ![p.title, p.clientEmail, p.provisionalClientName, p.description].some(v => String(v || '').toLowerCase().includes(sq))) return false;
                    if (currentFilters.status !== 'all' && p.status !== currentFilters.status) return false;
                    if (currentFilters.designer !== 'all') {
                        if (currentFilters.designer === 'null' && p.assignedDesignerEmail) return false;
                        if (currentFilters.designer !== 'null' && p.assignedDesignerEmail !== currentFilters.designer) return false;
                    }
                    if (currentFilters.client !== 'all' && p.clientEmail !== currentFilters.client) return false;
                    if (currentFilters.priority !== 'all') {
                        if (currentFilters.priority === 'vip' && !p.isVIP) return false;
                        if (currentFilters.priority === 'normal' && p.isVIP) return false;
                    }
                    return true;
                });

                if (currentFilters.sortBy === 'date-asc') {
                    filteredProjects.sort((a, b) => a.createdAt - b.createdAt);
                } else if (currentFilters.sortBy === 'date-desc') {
                    filteredProjects.sort((a, b) => b.createdAt - a.createdAt);
                } else if (currentFilters.sortBy === 'name-asc') {
                    filteredProjects.sort((a, b) => a.title.localeCompare(b.title));
                } else if (currentFilters.sortBy === 'name-desc') {
                    filteredProjects.sort((a, b) => b.title.localeCompare(a.title));
                } else if (currentFilters.sortBy === 'client-asc') {
                    filteredProjects.sort((a, b) => a.clientEmail.localeCompare(b.clientEmail));
                }

                currentPage = 1;
                render();
            }, 300);
        }

        window.updateFilter = (type, value) => {
            currentFilters[type] = value;
            applyFilters();
        };

        function formatSize(bytes) {
            const thresh = 1024;
            if (Math.abs(bytes) < thresh) return bytes + ' B';
            const units = ['KB', 'MB', 'GB'];
            let u = -1;
            do {
                bytes /= thresh;
                ++u;
            } while (Math.abs(bytes) >= thresh && u < units.length - 1);
            return bytes.toFixed(1) + ' ' + units[u];
        }

        window.copyLink = (url) => {
            navigator.clipboard.writeText(url).then(() => alert('Download link copied!'));
        };

        window.forceDownload = async (path, filename) => {
            try {
                const fileRef = ref(storage, path);
                const blob = await getBlob(fileRef);
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.error('Download error:', error);
                alert('Download failed: ' + error.message);
            }

            if (!confirm(dxa('assignConfirm').replace('{n}', legacy.length))) return;
            const cref = doc(db, 'counters', 'projects');
            try {
                for (let i = 0; i < legacy.length; i += 400) {
                    const chunk = legacy.slice(i, i + 400);
                    let assigned = [];
                    await runTransaction(db, async (tx) => {
                        assigned = [];
                        const snap = await tx.get(cref);
                        let next = snap.exists() ? snap.data().next : 1;
                        chunk.forEach(p => { tx.update(doc(db, 'projects', p.id), { projectNo: next }); assigned.push([p, next]); next++; });
                        tx.set(cref, { next });

                // Only auto-move the workflow status for early-stage projects.

                if (!project || !advancedStatuses.includes(project.status)) {
                    updates.status = designerEmail ? 'in-progress' : 'pending';

                if (type === 'phone') {

                    authEmail = dummyEmail;
                    username = phone;

                    authEmail = email;
                    username = email;

                // Create user with fetch to avoid logout
                const response = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=AIzaSyBOmZxS75qIodscsge-gHYuUlb2vCvl0ZM', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: authEmail,
                        password: password,
                        returnSecureToken: true
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || 'Failed to create user');

                // Create user document in Firestore (using UID as document ID)
                await setDoc(doc(db, 'users', data.localId), {

                } else if (error.message?.includes('WEAK_PASSWORD')) {

                        <td style="padding:6px;white-space:nowrap;">
                            <button type="button" class="btn-primary btn-small" onclick="approveNameRequest('${js(d.id)}','${js(r.uid)}','${js(r.requestedName)}')">✓</button>
                            <button type="button" class="btn-secondary btn-small" onclick="rejectNameRequest('${js(d.id)}')">✗</button>
                        </td>
                    </tr>`;
                }).join('') + '</table>';
            } catch (err) {
                el.textContent = 'Error loading requests: ' + err.message;
            }
        }

        window.approveNameRequest = async (requestId, uid, requestedName) => {
            try {
                await updateDoc(doc(db, 'users', uid), { username: requestedName });
                await updateDoc(doc(db, 'nameChangeRequests', requestId), {
                    status: 'approved', resolvedAt: Date.now(), resolvedBy: currentUser.email
                });
                loadNameRequests();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        };

        window.rejectNameRequest = async (requestId) => {
            try {
                await updateDoc(doc(db, 'nameChangeRequests', requestId), {
                    status: 'rejected', resolvedAt: Date.now(), resolvedBy: currentUser.email
                });
                loadNameRequests();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        };

        window.openGiftModal = () => {
            document.getElementById('giftModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('giftForm').reset();
            document.getElementById('giftIsDoctor').checked = true;
            document.getElementById('giftResult').style.display = 'none';
            document.getElementById('giftStatus').className = 'status-msg';
            loadGiftList();
        };

        window.closeGiftModal = () => {
            document.getElementById('giftModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        };

        window.handleGiftInvite = async (e) => {
            e.preventDefault();
            const name = document.getElementById('giftName').value.trim();
            const isDoctor = document.getElementById('giftIsDoctor').checked;
            const phone = document.getElementById('giftPhone').value.replace(/\D/g, '');
            const statusEl = document.getElementById('giftStatus');
            try {
                const token = randToken();
                const prize = rollPrize();
                const now = Date.now();
                await setDoc(doc(db, 'invites', token), {
                    type: 'mystery',
                    code: token,
                    phone, clientName: name, isDoctor, prize,
                    status: 'sealed', used: false,
                    createdBy: currentUser.email,
                    createdAt: now,
                    expiresAt: now + 7 * 24 * 60 * 60 * 1000
                });
                const link = `https://www.smilecenter.pro/gift.html?t=${token}`;
                const displayName = name ? (isDoctor ? drName(name) : name) : '';
                const msg = `שלום${displayName ? ' ' + displayName : ''} 🔒\nהכנו לך הזמנה אישית, חד-פעמית: סובב את הגלגל וגלה כמה שיניים נעצב לך במתנה 🦷🎡\nבתוקף 7 ימים. רק למספר הזה.\n👉 ${link}`;
                document.getElementById('giftLink').value = link;
                document.getElementById('giftWa').href = `https://wa.me/${waNumber(phone)}?text=${encodeURIComponent(msg)}`;
                document.getElementById('giftResult').style.display = 'block';
                statusEl.textContent = '✓ Gift invite created';
                statusEl.className = 'status-msg active success';
                loadGiftList();
            } catch (error) {
                statusEl.textContent = '✗ Error: ' + error.message;
                statusEl.className = 'status-msg active error';
            }
        };

        window.copyGiftLink = () => {
            navigator.clipboard.writeText(document.getElementById('giftLink').value);
        };

        async function loadGiftList() {
            const el = document.getElementById('giftList');
            try {
                const snap = await getDocs(query(collection(db, 'invites'), orderBy('createdAt', 'desc')));
                const rows = snap.docs.map(d => d.data()).filter(d => d.type === 'mystery').slice(0, 20);
                if (!rows.length) { el.textContent = '—'; return; }
                const expired = d => d.status !== 'redeemed' && d.expiresAt && Date.now() > d.expiresAt;
                el.innerHTML = '<table style="width:100%;border-collapse:collapse;">' + rows.map(d => `
                    <tr style="border-bottom:1px solid rgba(255,255,255,.08);">
                        <td style="padding:6px;">${esc(d.clientName || '')}</td>
                        <td style="padding:6px;direction:ltr;">${esc(d.phone)}</td>
                        <td style="padding:6px;">${esc(giftLabel(d.prize))}</td>
                        <td style="padding:6px;">${expired(d) ? '⌛ expired' : esc(GIFT_STATUS[d.status] || d.status)}</td>
                    </tr>`).join('') + '</table>';
            } catch (err) {
                el.textContent = 'Error: ' + err.message;
            }
        }

        window.copyInviteLink = () => {
            const linkInput = document.getElementById('inviteLink');
            linkInput.select();
            navigator.clipboard.writeText(linkInput.value).then(() => {
                alert('✓ Invite link copied! Send it via WhatsApp.');
            });
        };
    </script>
